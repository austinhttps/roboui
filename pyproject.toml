[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboui"
version = "0.1.0"
description = "On-Device Image-to-Code Web Generator using LangChain and quantized local LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "langchain-core>=0.2.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
local-llm = [
    "llama-cpp-python>=0.2.70"
]
